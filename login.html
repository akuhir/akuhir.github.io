<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Portal - Login</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body { width: 100%; overflow-x: hidden; }
        .login-page {
            background: linear-gradient(160deg, #f4f7fb 0%, #e9eef5 55%, var(--primary) 100%);
            padding: 0; min-height: 100vh; align-items: flex-start;
        }
        .login-container {
            padding: 28px 22px 32px; width: 100%; min-height: 100vh;
            align-items: center; box-sizing: border-box;
        }
        .login-card {
            border-radius: 0; padding: 0; box-shadow: none; background: transparent;
            width: 100%; max-width: 430px;
        }
        .login-header { text-align: center; }
        .login-logo {
            display: block; width: 100%; max-width: 155px; height: auto;
            margin: 0 auto 12px;
        }
        .login-header h3 {
            font-family: 'Poppins', sans-serif; color: var(--primary);
            font-size: 18px; font-weight: 700; line-height: 1.45;
            letter-spacing: -0.015em; margin: 8px 0 6px;
        }
        .login-header .institution-name {
            font-family: 'Inter', sans-serif; color: var(--text-light) !important;
            font-size: 14px !important; font-weight: 400; line-height: 1.5;
            letter-spacing: 0; text-transform: none; margin-top: 4px;
        }
        .login-form-title {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 19px;
            letter-spacing: 0.035em; line-height: 1.4; color: var(--primary);
            text-align: center; margin: 20px 0 14px;
        }
        .login-form {
            background: var(--accent); border-radius: 14px; padding: 20px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
        }
        .login-form .form-group > label:not(:has(#rememberMe)) { display: none !important; }
        .form-group { position: relative; margin-bottom: 14px; }
        .form-group input:not([type="checkbox"]) {
            width: 100%; box-sizing: border-box; min-height: 48px;
            padding: 13px 14px; border-radius: 9px;
            font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 400;
        }
        .form-group input:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.15);
        }
        .form-group:has(#rememberMe) {
            display: flex; align-items: center; margin-top: 2px; margin-bottom: 0;
        }
        .form-group:has(#rememberMe) label {
            display: flex; align-items: center; gap: 8px;
            font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400;
            line-height: 1.5; color: var(--text); cursor: pointer;
        }
        #rememberMe {
            width: 18px; height: 18px; flex-shrink: 0;
            accent-color: var(--primary); cursor: pointer;
        }
        .login-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; box-sizing: border-box; margin-top: 20px;
            min-height: 48px; padding: 13px 16px; border: none; border-radius: 9px;
            background: var(--primary); color: #fff; font-family: 'Poppins', sans-serif;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: filter 160ms ease, transform 160ms ease;
        }
        .login-btn:hover { background: var(--primary-dark); filter: brightness(0.96); }
        .login-btn:active { transform: translateY(1px); }
        .login-footer {
            text-align: center; color: var(--text-light); font-family: 'Inter', sans-serif;
            font-size: 13px; line-height: 1.6; border-top: none; padding-top: 16px;
        }
        .login-footer a { color: #ffffff; font-weight: 600; }
        .login-footer p:last-child { font-size: 12px !important; line-height: 1.6; }
        .login-page-footer { display: none; }
        .theme-toggle-login { top: 16px; right: 16px; }
        .login-page, .login-page input, .login-page button {
            font-family: 'Inter', Arial, sans-serif; -webkit-font-smoothing: antialiased;
        }
        @media (max-width: 380px) {
            .login-container { padding: 22px 16px 28px; }
            .login-logo { max-width: 130px; }
            .login-header h3 { font-size: 16px; }
            .login-form-title { font-size: 17px; }
            .login-form { padding: 16px; }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="images/logo.png" alt="AKUM Logo" class="login-logo">
                <h3>DEPARTMENT OF<br>HISTORY &amp; INTERNATIONAL RELATIONS</h3>
                <p class="institution-name">Abdulkadir Kure University, Minna</p>
            </div>
            <p class="login-form-title">H.I.S DIGITAL ARCHIVES</p>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <input type="text" id="matricNumber" placeholder="Enter Matric Number"
                           aria-label="Matric Number" required>
                    <span class="error-message" id="matricError"></span>
                </div>
                <div class="form-group">
                    <input type="text" id="studentName" placeholder="Enter any of your name"
                           aria-label="Student name" required>
                    <span class="error-message" id="nameError"></span>
                </div>
                <div class="form-group">
                    <label for="rememberMe">
                        <input type="checkbox" id="rememberMe">
                        Remember me for 30 days
                    </label>
                </div>
            </form>
            <button type="submit" form="loginForm" class="login-btn">Login</button>
            <div class="login-footer">
                <p>Issues accessing? <a href="mailto:abubakarnurudeen072188@gmail.com">Contact Administrator</a></p>
                <p style="margin-top: 14px; font-size: 0.78rem;">© 2026 History &amp; International Relations Department<br>Abdulkadir Kure University, Minna.</p>
            </div>
        </div>
        <div class="theme-toggle-login">
            <button id="themeToggleLogin" class="theme-btn" title="Toggle dark mode"></button>
        </div>
    </div>
    <script src="api-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
